[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "f1-podium-prediction"
version = "0.1.0"
description = "Machine learning system for predicting F1 race podium finishes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "xgboost>=2.0,<4",
    "pyarrow>=14",
    "requests>=2.31",
    "PyYAML>=6.0",
    "fastf1>=3.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "black>=24.0",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.scripts]
f1-predict = "src.prediction.predict:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
